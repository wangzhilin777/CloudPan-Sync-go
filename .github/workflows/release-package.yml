name: release-package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name, for example v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Optional release title'
        required: false
        type: string

jobs:
  server-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            binary_name: cloudpan-sync.exe
            asset_name: cloudpan-sync-go-windows-amd64.zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-darwin-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build server binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/server
          GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/server/${{ matrix.binary_name }}" ./cmd/cloudpan-sync

      - name: Package server binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            cd dist/server
            zip -9 "../../out/${{ matrix.asset_name }}" "${{ matrix.binary_name }}"
          else
            tar -C dist/server -czf "out/${{ matrix.asset_name }}" "${{ matrix.binary_name }}"
          fi

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}
          if-no-files-found: error

  docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: cloudpan-sync-go:release
          outputs: type=docker,dest=/tmp/cloudpan-sync-go-docker-image.tar

      - name: Compress Docker image archive
        shell: bash
        run: |
          set -euo pipefail
          gzip -c /tmp/cloudpan-sync-go-docker-image.tar > /tmp/cloudpan-sync-go-docker-image.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudpan-sync-go-docker-image.tar.gz
          path: /tmp/cloudpan-sync-go-docker-image.tar.gz
          if-no-files-found: error

  desktop-client-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout desktop client repo
        uses: actions/checkout@v4
        with:
          repository: wangzhilin777/cloud-clipboard-go
          path: cloud-clipboard-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.9'

      - name: Build desktop client
        shell: powershell
        working-directory: cloud-clipboard-go/desktop-client-go
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '1'
          go build -trimpath -ldflags='-s -w' -o .\dist\cloud-clipboard-desktop.exe .\cmd\cloud-clipboard-desktop
          Copy-Item .\config.example.json .\dist\config.example.json
          Copy-Item .\README.md .\dist\README-desktop-client.md
          Compress-Archive -Path .\dist\* -DestinationPath .\cloud-clipboard-desktop-windows-amd64.zip -Force

      - name: Upload desktop client artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-clipboard-desktop-windows-amd64.zip
          path: cloud-clipboard-go/desktop-client-go/cloud-clipboard-desktop-windows-amd64.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - server-build
      - docker-image
      - desktop-client-windows
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 sums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_name || inputs.tag_name) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/cloudpan-sync-go-windows-amd64.zip
            dist/cloudpan-sync-go-linux-amd64.tar.gz
            dist/cloudpan-sync-go-linux-arm64.tar.gz
            dist/cloudpan-sync-go-darwin-amd64.tar.gz
            dist/cloudpan-sync-go-darwin-arm64.tar.gz
            dist/cloudpan-sync-go-docker-image.tar.gz
            dist/cloud-clipboard-desktop-windows-amd64.zip
            dist/SHA256SUMS.txt
