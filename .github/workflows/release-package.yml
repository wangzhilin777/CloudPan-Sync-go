name: release-package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name, for example v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Optional release title'
        required: false
        type: string

jobs:
  server-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            binary_name: cloudpan-sync.exe
            asset_name: cloudpan-sync-go-windows-amd64.zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary_name: cloudpan-sync
            asset_name: cloudpan-sync-go-darwin-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build server binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/server
          GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/server/${{ matrix.binary_name }}" ./cmd/cloudpan-sync

      - name: Package server binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            cd dist/server
            zip -9 "../../out/${{ matrix.asset_name }}" "${{ matrix.binary_name }}"
          else
            tar -C dist/server -czf "out/${{ matrix.asset_name }}" "${{ matrix.binary_name }}"
          fi

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}
          if-no-files-found: error

  desktop-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            binary_name: cloudpan-sync-desktop.exe
            asset_name: cloudpan-sync-go-desktop-windows-amd64.zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary_name: cloudpan-sync-desktop
            asset_name: cloudpan-sync-go-desktop-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary_name: cloudpan-sync-desktop
            asset_name: cloudpan-sync-go-desktop-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary_name: cloudpan-sync-desktop
            asset_name: cloudpan-sync-go-desktop-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary_name: cloudpan-sync-desktop
            asset_name: cloudpan-sync-go-desktop-darwin-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build desktop binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/desktop/${{ matrix.binary_name }}" ./cmd/cloudpan-sync-desktop

      - name: Package desktop binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            cd dist/desktop
            zip -9 "../../out/${{ matrix.asset_name }}" "${{ matrix.binary_name }}"
          else
            tar -C dist/desktop -czf "out/${{ matrix.asset_name }}" "${{ matrix.binary_name }}"
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}
          if-no-files-found: error

  docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: |
            cloudpan-sync-go:release
            cloudpan-sync-go:latest
          provenance: false
          sbom: false
          outputs: type=docker,dest=/tmp/cloudpan-sync-go-docker-image.tar

      - name: Compress Docker image archive
        shell: bash
        run: |
          set -euo pipefail
          gzip -c /tmp/cloudpan-sync-go-docker-image.tar > /tmp/cloudpan-sync-go-docker-image.tar.gz

      - name: Verify Docker archive tags
        shell: bash
        run: |
          set -euo pipefail
          docker load -i /tmp/cloudpan-sync-go-docker-image.tar >/tmp/cloudpan-docker-load.log
          docker image inspect cloudpan-sync-go:release >/dev/null
          docker image inspect cloudpan-sync-go:latest >/dev/null

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudpan-sync-go-docker-image.tar.gz
          path: /tmp/cloudpan-sync-go-docker-image.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - server-build
      - desktop-build
      - docker-image
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 sums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Verify release asset whitelist
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          expected_assets=(
            "SHA256SUMS.txt"
            "cloudpan-sync-go-darwin-amd64.tar.gz"
            "cloudpan-sync-go-darwin-arm64.tar.gz"
            "cloudpan-sync-go-desktop-darwin-amd64.tar.gz"
            "cloudpan-sync-go-desktop-darwin-arm64.tar.gz"
            "cloudpan-sync-go-desktop-linux-amd64.tar.gz"
            "cloudpan-sync-go-desktop-linux-arm64.tar.gz"
            "cloudpan-sync-go-desktop-windows-amd64.zip"
            "cloudpan-sync-go-docker-image.tar.gz"
            "cloudpan-sync-go-linux-amd64.tar.gz"
            "cloudpan-sync-go-linux-arm64.tar.gz"
            "cloudpan-sync-go-windows-amd64.zip"
          )

          mapfile -t actual_assets < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_assets[@]}" | sort)

          printf 'Expected assets:\n%s\n' "${expected_sorted[*]}"
          printf 'Actual assets:\n%s\n' "${actual_assets[*]}"

          if [ "${#actual_assets[@]}" -ne "${#expected_sorted[@]}" ]; then
            echo "Release asset count mismatch."
            exit 1
          fi

          for i in "${!expected_sorted[@]}"; do
            if [ "${actual_assets[$i]}" != "${expected_sorted[$i]}" ]; then
              echo "Unexpected release asset: expected ${expected_sorted[$i]}, got ${actual_assets[$i]}"
              exit 1
            fi
          done

          if find . -maxdepth 1 -type f \( -iname '*cloud-clipboard*' -o -iname '*clipboard*' \) | grep -q .; then
            echo "Detected unexpected foreign artifact name."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_name || format('{0} 正式发布', inputs.tag_name)) || format('{0} 正式发布', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            CloudPan Sync Go 正式发布版本。

            本次发布包含：
            - Windows / Linux / macOS 服务端包
            - Windows / Linux / macOS 桌面客户端包
            - Docker 镜像归档包
            - SHA256 校验文件

            使用说明请参考 README：
            https://github.com/wangzhilin777/CloudPan-Sync-go/blob/main/README.md
          files: |
            dist/cloudpan-sync-go-windows-amd64.zip
            dist/cloudpan-sync-go-linux-amd64.tar.gz
            dist/cloudpan-sync-go-linux-arm64.tar.gz
            dist/cloudpan-sync-go-darwin-amd64.tar.gz
            dist/cloudpan-sync-go-darwin-arm64.tar.gz
            dist/cloudpan-sync-go-desktop-windows-amd64.zip
            dist/cloudpan-sync-go-desktop-linux-amd64.tar.gz
            dist/cloudpan-sync-go-desktop-linux-arm64.tar.gz
            dist/cloudpan-sync-go-desktop-darwin-amd64.tar.gz
            dist/cloudpan-sync-go-desktop-darwin-arm64.tar.gz
            dist/cloudpan-sync-go-docker-image.tar.gz
            dist/SHA256SUMS.txt
